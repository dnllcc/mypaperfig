[project]
name = "mypaperfig"
version = "0.1.0"
description = "Matplotlib figures sized and typeset to fit the MyPaper LaTeX class without rescaling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
